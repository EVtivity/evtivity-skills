name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag
        id: tag
        run: |
          . scripts/release-version.sh
          tag="${GITHUB_REF_NAME}"
          if ! release_tag_is_valid "$tag"; then
            echo "::error::$tag is not vX.Y.Z or vX.Y.Z-(alpha|beta|nightly)[.N]"
            exit 1
          fi
          release_check_version "$tag"
          release_check_source "$tag"
          if release_tag_is_prerelease "$tag"; then prerelease=true; else prerelease=false; fi
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "channel=$(release_tag_channel "$tag")"
            echo "previous=$(release_previous_tag "$tag")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate the skills
        run: |
          pip install --quiet "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          for dir in skills/*/; do skills-ref validate "$dir"; done
          python3 scripts/check-skills.py
          python3 scripts/sync-descriptions.py --check
          python3 scripts/check-api-paths.py
      - name: Release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PREVIOUS: ${{ steps.tag.outputs.previous }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          version="${TAG#v}"
          {
            commit=$(bash scripts/release-version.sh release_skill_metadata evtivity-commit)
            if [ "$CHANNEL" != stable ]; then
              echo "Prerelease ($CHANNEL) for EVtivity CSMS $version. Use it with CSMS $TAG deployments."
            else
              echo "Skills for EVtivity CSMS $version."
            fi
            echo
            echo "Made for CSMS release $TAG, commit $commit. \`setup.sh\` installs exactly that release."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --format='- %s (%h)' "$PREVIOUS..$TAG"
            else
              git log --no-merges --format='- %s (%h)' "$TAG"
            fi
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo "npx skills add EVtivity/evtivity-skills"
            for dir in skills/*/; do
              echo "gh skill install EVtivity/evtivity-skills $(basename "$dir")@$TAG"
            done
            echo '```'
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/$PREVIOUS...$TAG"
            fi
          } > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest
          fi
      - name: Upload the .well-known discovery index and skill archives
        # Agent Skills discovery (schema 0.2.0). The website does not serve
        # /.well-known/agent-skills/ yet, so the files are release assets.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/build-discovery.py --tag "$TAG" --out dist --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" dist/index.json dist/*.tar.gz
